        radio_group_name: Entraînement attaque
        training: true
        briefing: "Champ de tir air-sol dans le désert au sud-ouest de Cairo West, à 17 nm de la base : blindés et camions immobiles en tir interdit, dépôt de carburant et poste de commandement. Le drone Reaper 1 tourne au-dessus.\nPosition : bullseye 265°/146 nm (N29°56.835' E030°37.497'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 59 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 49 nm."
      - type: zone
        zone_name: combatZone_DesertGizeh_Medium
        friendly_name: A2 Attaque désert de Gizeh — moyen
        radio_group_name: Entraînement attaque
        training: true
        includes:
          - combatZone_DesertGizeh_Easy
        briefing: "Champ de tir du désert de Gizeh : une compagnie blindée active et de l'artillerie antiaérienne légère en plus des cibles du niveau facile.\nPosition : bullseye 265°/146 nm (N29°56.835' E030°37.497'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 59 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 49 nm."
      - type: zone
        zone_name: combatZone_DesertGizeh_Hard
        friendly_name: A3 Attaque désert de Gizeh — difficile
        radio_group_name: Entraînement attaque
        training: true
        includes:
          - combatZone_DesertGizeh_Medium
        briefing: "Champ de tir du désert de Gizeh : un second groupe blindé et une défense courte portée à guidage infrarouge (SA-13 ou SA-9), avec un Shilka.\nPosition : bullseye 265°/146 nm (N29°56.835' E030°37.497'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 59 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 49 nm."
      - type: zone
        zone_name: combatZone_DesertOuest_Easy
        friendly_name: S1 SEAD désert occidental — facile
        radio_group_name: Entraînement SEAD
        training: true
        briefing: "Site SEAD dans le désert occidental, à 52 nm au sud-ouest de Cairo West : une batterie sol-air moyenne portée, SA-6 ou SA-11 tirée au sort.\nPosition : bullseye 259°/178 nm (N29°37.218' E030°03.892'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 89 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 78 nm."
      - type: zone
        zone_name: combatZone_DesertOuest_Medium
        friendly_name: S2 SEAD désert occidental — moyen
        radio_group_name: Entraînement SEAD
        training: true
        includes:
