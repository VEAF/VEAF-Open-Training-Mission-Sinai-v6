        briefing: "Site SEAD du désert occidental en réseau Skynet : un radar d'alerte avancée guide les batteries, qui restent éteintes jusqu'au dernier moment.\nPosition : bullseye 259°/178 nm (N29°37.218' E030°03.892'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 89 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 78 nm."
      - type: zone
        zone_name: combatZone_Pyramides
        friendly_name: T Tourisme — pyramides de Gizeh
        radio_group_name: Tourisme
        training: true
        completable: false
        briefing: "Visite aérienne des pyramides, hors combat, au départ du FARP Pyramides (2 nm au sud-ouest du plateau). Circuit : Gizeh (Khéops, Khéphren, Mykérinos, le Sphinx), puis Saqqarah (pyramide à degrés de Djoser, 8 nm au sud-sud-est), puis Dahchour (pyramide rouge et pyramide rhomboïdale, 4 nm plus au sud). Une balise radio FM à chaque site (GIZ 31.0, SAQ 32.0, DAH 33.0) ; survolez un monument à moins de 1 500 ft sol et un guide vous le raconte. Excursion : la pyramide effondrée de Meïdoum, 25 nm au sud de Dahchour. Dans le sanctuaire bleu du Caire : un appareil rouge y est détruit.\nPosition : bullseye 264°/119 nm (N29°58.296' E031°08.157')."
      - type: zone
        zone_name: combatZone_TeteDePont
        friendly_name: Z01 Front ouest — tête de pont face à Ismaïlia
        radio_group_name: Front
        training: false
        briefing: "La brigade blindée rouge qui tient la rive est du canal, face à Ismaïlia : chars, blindés et lance-roquettes en position. Détruire les blindés et l'artillerie ; défense SA-15 possible, SA-13 et artillerie antiaérienne. Les Hawk d'Abu Suwayr couvrent la rive ouest.\nPosition : bullseye 297°/55 nm (N30°37.038' E032°27.935'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 46 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 53 nm."
      - type: zone
        zone_name: combatZone_Mitla
        friendly_name: Z02 Front ouest — ligne du col de Mitla
        radio_group_name: Front
        training: false
        briefing: "La ligne de défense rouge du col de Mitla, la route de Suez vers Nakhl : chars enterrés, blindés et artillerie automotrice. Défense courte portée seulement (SA-13, Shilka) : le drone Reaper 2 la désigne au laser.\nPosition : bullseye 248°/29 nm (N30°00.680' E032°53.471'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 59 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 70 nm."
      - type: zone
        zone_name: combatZone_AbuAgeila
        friendly_name: Z03 Front est — carrefour d'Abu Ageila
        radio_group_name: Front
        training: false
        briefing: "Le carrefour fortifié d'Abu Ageila, sur la route d'El Arish à Ismaïlia, face à la frontière israélienne : une brigade mécanisée et ses lance-roquettes. Détruire les blindés et les Grad ; défense SA-8 et artillerie antiaérienne, sous la QRA d'El Arish.\nPosition : bullseye 043°/54 nm (N30°51.000' E034°07.200'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 51 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 64 nm."
      - type: zone
        zone_name: combatZone_Maghara
        friendly_name: Z04 SEAD — site SA-6 du djebel Maghara
        radio_group_name: SEAD
        training: false
        briefing: "Le site SA-6 perché au djebel Maghara, au nord du Sinaï, relié à un radar d'alerte avancée en réseau Skynet. Détruire le radar de conduite de tir et les lanceurs ; un Shilka protège le site.\nPosition : bullseye 359°/30 nm (N30°42.000' E033°24.000'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 89 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 100 nm."
      - type: zone
        zone_name: combatZone_Nakhl
        friendly_name: Z05 SEAD — site sol-air de Nakhl
        radio_group_name: SEAD
        training: false
        briefing: "Le site sol-air qui couvre le carrefour de Nakhl, au centre du Sinaï : une batterie SA-2 ou SA-3 tirée au sort, son radar d'alerte avancée et un Shilka. Sous la couverture lointaine du SA-10 du centre-sud.\nPosition : bullseye 128°/22 nm (N29°57.936' E033°44.784'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 91 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 99 nm."
      - type: zone
        zone_name: combatZone_ConvoiElArish
        friendly_name: Z06 Convoi — El Arish vers Abu Ageila
        radio_group_name: Convois
        training: false
        briefing: "Un convoi de renforts quitte El Arish par la route du sud-est vers le carrefour d'Abu Ageila. L'arrêter avant Abu Ageila ; il porte sa propre artillerie antiaérienne (ZU-23) et un SA-9.\nPosition : bullseye 027°/50 nm (N30°56.152' E033°51.671'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 64 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 77 nm."
      - type: zone
        zone_name: combatZone_ConvoiNakhl
        friendly_name: Z07 Convoi — Nakhl vers le col de Mitla
        radio_group_name: Convois
        training: false
        briefing: "Des renforts blindés roulent de Nakhl vers le col de Mitla, pour renforcer la ligne face à Suez. Les arrêter avant le col ; le convoi est escorté par un SA-13.\nPosition : bullseye 138°/19 nm (N29°57.423' E033°39.395'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 95 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 103 nm."
      - type: zone
        zone_name: combatZone_ConvoiFeiran
        friendly_name: Z08 Convoi — oasis de Feiran vers Abu Rudeis
        radio_group_name: Convois
        training: false
        briefing: "Un convoi de carburant descend l'oued Feiran vers les dépôts d'Abu Rudeis, sur le golfe de Suez. Le détruire avant la côte ; il porte sa propre artillerie antiaérienne. Sous la couverture du SA-10 de St Catherine.\nPosition : bullseye 165°/86 nm (N28°48.247' E033°49.986'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 118 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 130 nm."
      - type: zone
        zone_name: combatZone_UsinesPortFouad
        friendly_name: Z09 Frappe — usines de Port-Fouad
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Les usines de la zone industrielle au sud de Port-Fouad, sur la rive est du canal, reconverties en ateliers d'armement : ateliers, hangars, réservoirs chimiques. Tout détruire ; défense SA-6, SA-9 et artillerie antiaérienne (reprise de la v5).\nPosition : bullseye 314°/78 nm (N31°06.118' E032°19.738'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 64 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 66 nm."
      - type: zone
        zone_name: combatZone_EtatMajor
        friendly_name: Z10 Frappe — état-major de Bir Tamada
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Le poste de commandement de l'armée rouge du Sinaï, enterré à Bir Tamada : bunkers, centre de transmissions, véhicules de commandement. Tout détruire ; défense SA-15 et Shilka, sous la QRA de Melez.\nPosition : bullseye 120°/5 nm (N30°09.000' E033°30.000'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 90 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 101 nm."
      - type: zone
        zone_name: combatZone_Scud
        friendly_name: Z11 Frappe — base de missiles du djebel Libni
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Une base de missiles sol-sol au pied du djebel Libni, d'où les Scud menacent Le Caire et Beer-Sheva : lanceurs et camions de ravitaillement. Détruire les lanceurs ; défense SA-15 et Shilka.\nPosition : bullseye 033°/36 nm (N30°42.000' E033°48.000'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 69 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 81 nm."
      - type: zone
        zone_name: combatZone_AbuRudeis
        friendly_name: Z12 Frappe — dépôts pétroliers d'Abu Rudeis
        radio_group_name: Frappes en profondeur
        training: false
        briefing: "Les dépôts pétroliers d'Abu Rudeis, sur la côte du golfe de Suez : ils ravitaillent toute l'armée rouge du sud. Détruire réservoirs et pompes ; ZU-23 sur place, et le SA-10 de St Catherine à moins de 40 nm.\nPosition : bullseye 186°/76 nm (N28°56.323' E033°14.804'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 87 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 99 nm."
      - type: zone
        zone_name: combatZone_ElGora
        friendly_name: Z13 OCA — base aérienne d'El Gora
        radio_group_name: Bases aériennes
        training: false
        briefing: "La base aérienne d'El Gora, à 30 km de la frontière israélienne : chasseurs-bombardiers au parking, hangars et carburant. Tout détruire au sol ; défense SA-15 et Shilka.\nPosition : bullseye 036°/65 nm (N31°04.377' E034°09.279'). Ravitailleurs : Arco 2 (panier, TACAN 53Y, 293.0) à 49 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 62 nm."
      - type: zone
        zone_name: combatZone_Sharm
        friendly_name: Z14 OCA — base aérienne de Sharm el-Cheikh
        radio_group_name: Bases aériennes
        training: false
        briefing: "L'aéroport de Sharm el-Cheikh, devenu base aérienne rouge à la pointe sud du Sinaï : avions de transport et hélicoptères d'attaque au sol, hangars. Tout détruire au sol ; défense SA-6 et ZU-23, plus le SA-15 permanent de la base.\nPosition : bullseye 158°/142 nm (N27°58.729' E034°23.109'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 169 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 179 nm."
      - type: zone
        zone_name: combatZone_Croiseur
        friendly_name: Z15 Antinavire — croiseur Moskva devant Damiette
        radio_group_name: Antinavire
        training: false
        briefing: "Le croiseur lance-missiles rouge Moskva et deux frégates croisent en Méditerranée, à 38 nm au nord de Damiette, pour couper la route des porte-avions. Les couler : le Moskva porte des missiles sol-air à 40 nm, les frégates à courte portée (reprise de la v5, dont le croiseur était le Piotr Velikiy).\nPosition : bullseye 326°/134 nm (N32°02.379' E031°56.947'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 114 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 110 nm."
      - type: zone
        zone_name: combatZone_Tiran
        friendly_name: Z16 Antinavire — détroit de Tiran
        radio_group_name: Antinavire
        training: false
        briefing: "Le rouge ferme le détroit de Tiran, la sortie du golfe d'Aqaba : une batterie de missiles antinavires (HY-2 Silkworm, portée 54 nm) à Ras Nasrani et un essaim de vedettes rapides dans le détroit. Détruire lanceurs et radar, couler les vedettes ; SA-15 permanent à Sharm el-Cheikh.\nPosition : bullseye 157°/145 nm (N27°56.894' E034°27.427'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 173 nm ; Texaco 2 (perche, TACAN 52Y, 292.0) à 180 nm."
cap_missions:
  - group_name: CAP-Centre-MiG29
    menu_name: CAP rouge MiG-29S (Fox 1) — centre du Sinaï — FL220
    briefing: 'Deux MiG-29S armés de R-27R, R-73 et R-60 patrouillent entre Bir Hasanah et Bir Gifgafa, au FL220. Emport : R-73*2,R-60M*2,R-27R*2,Fuel-1500.'
  - group_name: CAP-Nord-Su27
    menu_name: CAP rouge Su-27 (Fox 1, longue portée) — nord du Sinaï — FL260
    briefing: 'Deux Su-27 armés de R-27ER et R-73 patrouillent le long de la côte nord, de Bir al-Abd à El Arish, au FL260. Emport : R-73*4,R-27ER*6.'
  - group_name: CAP-Sud-MiG31
    menu_name: CAP rouge MiG-31 (intercepteur haut et rapide, R-33) — sud du Sinaï — FL380
    briefing: 'Deux MiG-31 armés de R-33 patrouillent haut et vite au-dessus de St Catherine, au FL380. Emport : R-40R*2,R-33*4.'
  - group_name: Raid-Tu22M
    menu_name: Raid rouge Tu-22M3 à intercepter — Nakhl — FL300
    briefing: 'Deux bombardiers Tu-22M3 chargés de bombes tournent au-dessus de Nakhl, au FL300, prêts à frapper le canal : les intercepter. Emport : FAB-500*33.'
  - group_name: CAP-Canal-F16
    menu_name: CAP bleue F-16C (Fox 3) — rive ouest du canal — FL220
    briefing: "Deux F-16C égyptiens patrouillent sur la rive ouest du canal, d'Ismaïlia à Suez, au FL220. Emport : AIM-120C*4,AIM-9M*2,ECM,Fuel*2."
  - group_name: CAP-Negev-F15
    menu_name: CAP bleue F-15C (Fox 3) — Néguev — FL250
    briefing: 'Deux F-15C israéliens couvrent le Néguev, de Hatzerim à Ramon, au FL250. Emport : AIM-9*4,AIM-120*4,Fuel.'
