        briefing: "Site SEAD du désert occidental : la batterie moyenne portée est protégée par une défense courte portée (SA-15, SA-8).\nPosition : bullseye 259°/178 nm (N29°37.218' E030°03.892'). Ravitailleurs : Arco 1 (panier, TACAN 51Y, 291.0) à 89 nm ; Texaco 1 (perche, TACAN 50Y, 290.0) à 78 nm."
      - type: zone
        zone_name: combatZone_DesertOuest_Hard
        friendly_name: S3 SEAD désert occidental — difficile
        radio_group_name: Entraînement SEAD
        training: true
        includes:
